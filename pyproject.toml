[project]
name = "ccnu-epower"
version = "0.5.0"
description = "Unofficial CLI for CCNU dormitory electricity balance, usage, and bills"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["ccnu", "electricity", "dormitory", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests>=2.28.0",
    "gmssl>=3.2.0",
    "python-dotenv>=1.2.1",
    "pillow>=10.1",
    "pystray>=0.19",
]

[project.scripts]
epower = "epower.cli:main"
epower-tray = "epower.tray:main"

[project.urls]
Homepage = "https://github.com/summeriver13/ccnu-epower"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app/epower"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 88
target-version = "py39"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
